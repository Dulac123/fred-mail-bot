name: Fred mejl bot

on:
  schedule:
    - cron: "*/20 * * * *"   # na svakih 20 minuta (UTC)
  workflow_dispatch:          # ručno pokretanje iz Actions taba

permissions:
  contents: write             # da može da sačuva state.json

concurrency:
  group: fred
  cancel-in-progress: false

jobs:
  proveri:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pokreni Freda
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-latest
          PRAG_MEJLOVA: "3"
        run: python3 mejl_bot.py --once

      - name: Sačuvaj stanje
        run: |
          git config user.name "fred-bot"
          git config user.email "fred-bot@users.noreply.github.com"
          git add -f state.json
          git diff --cached --quiet || (git commit -m "stanje" && git push)
