name: Fred mejl bot

# Posao radi ~5h40min u petlji (proverava mejl na svakih 5 min), pa sam sebe ponovo pokrene.
# Cron na 6h je samo rezerva, ako se lanac ikad prekine.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # da sačuva state.json
  actions: write    # da može da pokrene sledeći ciklus

concurrency:
  group: fred
  cancel-in-progress: false

jobs:
  proveri:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pokreni Freda (petlja)
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRAG_MEJLOVA: "3"
          PROVERA_MIN: "5"
        run: python3 -u mejl_bot.py --sati 5.6

      - name: Sačuvaj stanje
        if: always()
        run: |
          git config user.name "fred-bot"
          git config user.email "fred-bot@users.noreply.github.com"
          git add -f state.json
          git diff --cached --quiet || (git commit -m "stanje" && git pull -q --rebase && git push)

      - name: Pokreni sledeći ciklus
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fred.yml --repo "$GITHUB_REPOSITORY"
